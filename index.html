<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sai Nakshatra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, #263b78 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, #32175f 0%, transparent 30%),
                linear-gradient(135deg, #050816, #0b1230, #120827);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.7;
            background-image:
                radial-gradient(circle, white 1px, transparent 1px);
            background-size: 80px 80px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #5ee7ff, #8affb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #cbd5ff;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 22px;
            backdrop-filter: blur(12px);
        }

        .card h2 {
            margin-bottom: 12px;
            font-size: 25px;
        }

        .card p {
            color: #c8cbea;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .start-btn {
            border: none;
            border-radius: 30px;
            padding: 15px 35px;
            font-size: 17px;
            font-weight: bold;
            color: #07101f;
            background: linear-gradient(90deg, #62e8ff, #8cffb7);
            cursor: pointer;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 500px) {
            .logo {
                font-size: 34px;
            }

            .tagline {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <main class="container">

        <div class="logo">
            Sai Nakshatra
        </div>

        <div class="tagline">
            Discover your direction.<br>
            Prepare for your future.
        </div>

        <section class="card">

            <h2>Begin Your Journey ✨</h2>

            <p>
                Enter your birth details and explore your
                personalized Sai Nakshatra reading.
            </p>

            <button class="start-btn" onclick="startReading()">
                Start Your Reading
            </button>

        </section>

    </main>

    <script>
        function startReading() {
            window.location.href = "plans.html";
        }
    </script>

</body>
</html>
